name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "APP_ID=com.goodwy.dialer.debug"
            echo "VERSION_NAME=8.3.0-test"
            echo "VERSION_CODE=830"
            echo "RIGHT_APP_KEY="
            echo "PRODUCT_ID_X1="
            echo "PRODUCT_ID_X2="
            echo "PRODUCT_ID_X3="
            echo "SUBSCRIPTION_ID_X1="
            echo "SUBSCRIPTION_ID_X2="
            echo "SUBSCRIPTION_ID_X3="
            echo "SUBSCRIPTION_YEAR_ID_X1="
            echo "SUBSCRIPTION_YEAR_ID_X2="
            echo "SUBSCRIPTION_YEAR_ID_X3="
          } > local.properties

      - name: Verify Gradle
        run: gradle --version

      - name: Build FOSS debug APK
        run: gradle assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dialer-FOSS-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
